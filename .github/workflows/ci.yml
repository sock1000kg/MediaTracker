name: CI

on:
  push:
    branches: [ main ]
    paths:
      - "server/**"
      - "client/**"
  pull_request:

jobs:
  backend-lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backend Checks
        working-directory: ./server
        run: |
          npm ci
          npx prisma generate
          npx tsc --noEmit
          npm run lint
    
  frontend-lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontend Checks
        working-directory: ./client
        run: |
          npm ci
          npm run lint
          npm run build
          npm test
  
  security-audit-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create dummy env file
        run: touch server/.env

      - name: Build Frontend (Dev)
        # We need .dev.yaml because "frontend" is defined there
        run: docker compose --env-file server/.env -f docker-compose.yml -f docker-compose.dev.yml build frontend

      # Blocking: high/critical advisories in production dependencies only.
      # `npm audit` reads package-lock.json, not the installed tree, so even though the dev image
      # has devDependencies installed, --omit=dev is what limits the scope to production packages.
      - name: Audit Frontend (production, high+)
        run: docker compose --env-file server/.env -f docker-compose.yml -f docker-compose.dev.yml run --rm frontend npm audit --omit=dev --audit-level=high

      # Non-blocking: the full report (dev tooling, every severity) stays visible in the logs.
      - name: Audit Frontend (full, informational)
        continue-on-error: true
        run: docker compose --env-file server/.env -f docker-compose.yml -f docker-compose.dev.yml run --rm frontend npm audit
  
  security-audit-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create dummy env file
        run: touch server/.env
        
      - name: Build Backend (Prod)
        run: docker compose --env-file server/.env -f docker-compose.yml build backend

      # Blocking: high/critical advisories in production dependencies only.
      # The production image installs with --omit=dev, but `npm audit` reads package-lock.json, so
      # --omit=dev is what decides the scope (dev packages are in the lockfile either way).
      # --no-deps: Don't start the database
      - name: Audit Backend (production, high+)
        run: docker compose --env-file server/.env -f docker-compose.yml run --rm --no-deps backend npm audit --omit=dev --audit-level=high

      # Non-blocking: the full report (dev tooling, every severity) stays visible in the logs.
      - name: Audit Backend (full, informational)
        continue-on-error: true
        run: docker compose --env-file server/.env -f docker-compose.yml run --rm --no-deps backend npm audit

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mydb_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user -d mydb_test"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=20

      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="valkey-cli ping"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=20

    env:
      # Non-secret test env
      NODE_ENV: test
      RATE_LIMIT_ENABLED: false
      REGISTER_KEY: "register_key"
      PORT: 5000
      POSTGRES_DB: mydb_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password

      # Secrets
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      JWT_KEY_SECRET: ${{ secrets.JWT_KEY_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
      API_KEY_SECRET: ${{ secrets.API_KEY_SECRET }}
      DEMO_USER_PASSWORD: ${{ secrets.DEMO_USER_PASSWORD }}
      SYSTEM_USER_PASSWORD: ${{ secrets.SYSTEM_USER_PASSWORD }}

      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/mydb_test
      # Enables the BullMQ contract tests
      REDIS_URL_TEST: redis://localhost:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: ./server
        run: npm ci
        
      - name: Generate Prisma Client
        working-directory: ./server
        run: npx prisma generate

      - name: Type Check
        working-directory: ./server
        run: npx tsc --noEmit

      - name: Run Migrations
        working-directory: ./server
        run: npx prisma migrate deploy

      - name: Run Tests
        working-directory: ./server
        run: npm run test
