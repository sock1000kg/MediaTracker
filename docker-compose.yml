# docker compose -f docker-compose.yml up --build

services:
  backend:
    build:
      context: ./server #Dockerfile location
      dockerfile: dockerfile
      target: production
    env_file:
      - .env
    environment:
      # Internal service address (not a secret). Named REDIS_URL because that's the URL scheme BullMQ expects; Valkey is Redis-compatible.
      - REDIS_URL=redis://valkey:6379
    depends_on: # Wait for database and valkey to be healthy first
      database:
        condition: service_healthy
      valkey:
        condition: service_healthy

  database:
    image: postgres:17
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 2s
      retries: 20
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    restart: always
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 20
    volumes:
      - valkey_data:/data
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  valkey_data: