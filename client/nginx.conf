server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Turns on gzip compression for responses, reducing bandwidth usage.
    gzip on;
    gzip_types text/plain application/javascript text/css application/json;
    gzip_min_length 256;
}